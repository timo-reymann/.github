ort:
  enableRepositoryPackageConfigurations: true
  enableRepositoryPackageCurations: true
  forceOverwrite: true
  licenseFactProviders:
    - type: "SPDX"
    - type: "ScanCode"
    - type: "DefaultLicenseTextCuration"
  
  licenseFilePatterns:
    licenseFilenames: ['license*']
    noticeFilenames: ['notice*']
    patentFilenames: ['patents']
    otherLicenseFilenames: ['readme*']

  packageConfigurationProviders:
  - type: DefaultDir
  - type: OrtConfig

  # Package curation providers are listed from highest to lowest priority. Technically, they are applied in reverse
  # order: The provider with the highest priority is applied last, so it can overwrite any previously applied curations.
  packageCurationProviders:
  - type: DefaultFile
  - type: DefaultDir

  severeIssueThreshold: ERROR
  severeRuleViolationThreshold: ERROR

  analyzer:
    allowDynamicVersions: true
    packageManagers:
      GoMod:
        options:
          forceDirectGoProxy: false
      Yarn2:
        mustRunAfter:
          - Cargo

  downloader:
    allowMovingRevisions: true
    skipExcluded: true
  scanner:
    skipConcluded: true
    skipExcluded: true
    scanners:
      Askalono:
        options:
          readFromStorage: true
          writeToStorage: true
    archive:
      enabled: true
      fileStorage:
        localFileStorage:
          directory: /home/ort/.ort/scanner/archive
          compression: false

    fileListStorage:
      fileStorage:
        localFileStorage:
          directory: /home/ort/.ort/scanner/file-lists
          compression: false

    storages:
      local:
        backend:
          localFileStorage:
            directory: /home/ort/.ort/scanner/results
            compression: false

    storageReaders: [local]
    storageWriters: [local]

    provenanceStorage:
      fileStorage:
        localFileStorage:
          directory: /home/ort/.ort/scanner/provenance
          compression: false

  reporter:
    config:
      CycloneDx:
        options:
          schema.version: 1.6
